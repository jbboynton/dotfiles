set -g default-terminal "tmux-256color"

# Panes start plain shells, which skip zprofile and keep tmux's environment
set -g default-command "${SHELL}"

# Keep Claude Code's marker out of panes. A server started from an agent's
# shell would hand every pane CLAUDECODE=1, and zshrc would then load none
# of the aliases and functions there.
set-environment -gu CLAUDECODE

# Pass Alacritty's truecolor through to programs inside tmux
set -as terminal-features ",alacritty:RGB"

# Pass OSC 8 links (a label with a hidden URL) through to Alacritty too,
# and underline styles and colors (vim's spell-check undercurls)
set -as terminal-features ",alacritty:hyperlinks:usstyle"

# Report modified keys (Ctrl-> from Alacritty's bindings, Shift-Enter) to
# programs as CSI-u instead of folding them into plain keys. `always`, not
# `on`: with `on` a program has to ask for them, and vim doesn't.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ",alacritty:extkeys"

# Tell programs when their pane gains or loses focus (vim's autoread)
set -g focus-events on

unbind C-b
set -g prefix C-s
bind-key -r C-s send-prefix

# Restore 'clear scrollback'
bind C-l send-keys 'C-l'

# Force reload of .tmux.conf
bind-key r source-file ~/.tmux.conf \; display-message "Reloading .tmux.conf..."

# Turn on the mouse?
set -g mouse on

# Increase history
set -g history-file ~/.history/tmux_history
set -g history-limit 50000

# Colors and format
# Popups, menus and messages in Alacritty's colors
set -s theme dark
set -s dark-theme-black black
set -s dark-theme-dark-grey black
set -s dark-theme-light-grey brightblack
set -s dark-theme-white white
set -s dark-theme-red red
set -s dark-theme-green green
set -s dark-theme-yellow yellow
set -s dark-theme-blue blue
set -s dark-theme-cyan cyan
set -s dark-theme-magenta magenta
set -g mode-style "fg=colour2,bg=colour8"
set -g status-style "fg=colour2,bg=colour0"
# Marks after a window's name for the Claude chats in it that need
# James (bin/agent_state sets these on the chat's pane): a red ✕ for
# each that is blocked, after a space; and a yellow "..." right after the
# name when any has a question but is still working. The current
# window's "*" flag and the last window's "-" are not shown; the other
# flags are.
set -g @marks_blocked "#{P:#{?#{==:#{@agent_state},blocked},#[fg=red]✕,}}"
set -g @marks_wants "#{P:#{?#{==:#{@agent_state},blocked},,#{?@agent_wants,1,}}}"
set -g @window_label " #I:#W#{?#{E:@marks_wants},#[fg=yellow]...#[fg=default],}#{s/[*-]//:window_flags}#{?#{E:@marks_blocked}, #{E:@marks_blocked}#[fg=default],} "
setw -g window-status-current-style "fg=colour3,bg=colour0"
setw -g window-status-current-format "#{E:@window_label}"
setw -g window-status-style "fg=colour6,bg=colour0"
setw -g window-status-format "#{E:@window_label}"
# A bell does not reverse the window's colors: Claude Code rings it when
# a chat is blocked, and the red ✕ says that already. The "!" flag stays.
setw -g window-status-bell-style default
setw -g pane-active-border-style "fg=colour6"
setw -g pane-border-style "fg=colour8"

# Format and style playground
bind S split-window -v -l 14 ~/.dotfiles/bin/tmux-style

# Status bar
set -g status-keys "emacs"
set -g status-left-length 50
set -g status-right "%A, %B %d | %I:%M %p"

# Sessions
bind C new-session

# Fuzzy-find windows (f) and sessions (F)
bind-key f display-popup -E -w 80% -h 75% "~/.bin/tmux_pick windows"
bind-key F display-popup -E -w 80% -h 75% "~/.bin/tmux_pick sessions"

# Panes
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind = select-layout even-vertical
bind + select-layout even-horizontal

# Merge current window into another window
bind-key M choose-tree -Zw "join-pane -v -t '%%'"

# Resize a lot
bind -n S-Left resize-pane -L 3
bind -n S-Down resize-pane -D 3
bind -n S-Up resize-pane -U 3
bind -n S-Right resize-pane -R 3

# Windows
bind c new-window -c "#{pane_current_path}"

# Renumber windows to match keyboard layout
set -g base-index 1
set -g renumber-windows on

# Move window left or right with Shift + Left or Shift + Right
bind-key S-Left swap-window -t -1\; select-window -t -1
bind-key S-Right swap-window -t +1\; select-window -t +1

# Copy and paste
# Use Vim keybindings in copy mode
setw -g mode-keys vi

# Save current buffer
bind y run 'tmux save-buffer - | pbcopy'

# Vim-style visual selection and yanking
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# A scrollbar and line numbers, in copy mode only
setw -g pane-scrollbars modal
setw -g copy-mode-line-numbers hybrid

# Click a link or a file path to open it (bin/tmux_open decides what the
# click landed on, and ignores anything that isn't a web link or a path
# that exists). The click still goes to the pane as usual. Everything is
# quoted, since the text is whatever a program printed.
bind-key -T root MouseDown1Pane select-pane -t = \; send-keys -M \; if-shell -F -t = "#{||:#{mouse_hyperlink},#{m/r:[/.~],#{mouse_line}}}" { run-shell -b -t = "~/.bin/tmux_open --link=#{q:mouse_hyperlink} --line=#{q:mouse_line} --x=#{e|-:#{mouse_x},#{pane_left}} --cwd=#{q:pane_current_path}" }

# Option-click opens whatever path was clicked in vim, even a folder, an
# image, or a bare name; the click does not reach the pane
bind-key -T root M-MouseDown1Pane select-pane -t = \; run-shell -b -t = "~/.bin/tmux_open --vim --link=#{q:mouse_hyperlink} --line=#{q:mouse_line} --x=#{e|-:#{mouse_x},#{pane_left}} --cwd=#{q:pane_current_path}"

# The wheel scrolls the chat that bin/claude_edit shows in Claude's pane
# while a reply is open (@chat_view), three lines a notch. The pager there
# is kept out of mouse mode, where it would highlight any link clicked.
# Everywhere else the wheel does what tmux does by default.
bind-key -T root WheelUpPane if-shell -F -t = "#{&&:#{@chat_view},#{!:#{pane_in_mode}}}" { send-keys -t = -N 3 k } { if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e } }
bind-key -T root WheelDownPane if-shell -F -t = "#{&&:#{@chat_view},#{!:#{pane_in_mode}}}" { send-keys -t = -N 3 j } { send-keys -M }

# Which pane Claude Code's editor (Ctrl-G, bin/claude_edit) takes over in
# this window: e picks one with the number overlay, E goes back to the
# pane below Claude's
bind e display-panes -d 0 "set -w @claude_edit_pane '%%'"
bind E set -wu @claude_edit_pane

# Aliases
set -s command-alias[100] tabe='new-session'

# Attempt to disable the mouse
# unbind -n Left
# unbind -n Up
# unbind -n Down
# unbind -n Right
# unbind -n MouseDown1Pane
# unbind -n MouseDown1Status
# unbind -n MouseDown3Pane
# unbind -n MouseDrag1Border
# unbind -n MouseDrag1Pane
# unbind -n MouseDragEnd1Pane
# unbind -n WheelDownPane
# unbind -n WheelDownStatus
# unbind -n WheelUpPane
# unbind -n WheelUpStatus
bind-key -T root MouseDown2Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M }

# tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
# Free up F for sessions
set -g @tmux-fzf-launch-key 'C-f'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim 'session'

run -b '~/.tmux/plugins/tpm/tpm'
